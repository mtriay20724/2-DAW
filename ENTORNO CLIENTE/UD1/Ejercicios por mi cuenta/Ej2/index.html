<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            /* En una variable tienes el lado de un cuadrado, debes escribir
            un programa que te calcule el área y el perímetro del cuadrado.
            El area la calculas como lado multiplicado por lado.
            El perímetro es la suma de los cuatro lados.*/

            const lado = 5;
            const area = lado * lado;
            const perimetro = lado * 4;

            console.log("El perimetro de un cuadrado es: " + perimetro);
            console.log("El area de un cuadrado es: " + area);
        </script>
    </body>
</html>
